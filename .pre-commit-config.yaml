# Runs the same checks as CI (just check) before each commit, using the project's own
# pinned tool versions from uv.lock rather than separately pinned hook repos.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        types: [python]
        pass_filenames: false
